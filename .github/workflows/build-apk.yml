name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# GITHUB_TOKEN 默认只读；创建 Release 需要 contents: write 权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MCDC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MCDC-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # 自动发布到 GitHub Releases：每次构建用唯一 tag（nightly-<run_number>）保留独立版本，
      # 所有历史构建都会累积保留；最新的一个标记为 Latest 方便下载。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build (${{ github.run_number }})
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          body: |
            🤖 自动构建的 MC/DC 真值表生成器安装包
            - 提交: ${{ github.sha }}
            - 构建序号: ${{ github.run_number }}
            - Debug / Release 两个 APK 见下方 Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
