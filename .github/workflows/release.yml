name: Release

on:
  # 正式发行：打 v* tag 推送即发版（版本即 tag，语义清晰可追溯）
  push:
    tags:
      - 'v*'
  # 可选手动入口：在 Actions 页面点 Run workflow 填版本号也能发（不影响 tag 主逻辑）
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0'
        required: true

# 创建 GitHub Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 当前 build.gradle 已用 debug key 给 release 签名（够 sideload，不能上架）。
      # 暂无正式签名密钥，因此这里直接 assembleRelease 即可。
      # 日后要正式签名见 docs/ci-cd.md §6。
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MC/DC Generator ${{ steps.ver.outputs.tag }}
          # tag 含 '-'（如 v0.1.0-beta）自动标记为预发布，且不抢占 Latest；纯 v* 为正式版
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          body: |
            🚀 发行版本 ${{ steps.ver.outputs.tag }}
            类型: ${{ contains(github.ref_name, '-') && '🧪 测试版 (pre-release)' || '✅ 正式版' }}
            - 提交: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
