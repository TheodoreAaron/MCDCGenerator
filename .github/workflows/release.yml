name: Release

on:
  # 正式发行：打 v* tag 推送即发版（版本即 tag，语义清晰可追溯）
  push:
    tags:
      - 'v*'
  # 可选手动入口：在 Actions 页面点 Run workflow 填版本号也能发（不影响 tag 主逻辑）
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0'
        required: true

# 创建 GitHub Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 固定签名密钥（可选）：仅当仓库配置了 RELEASE_KEYSTORE_BASE64 等 Secrets 时启用。
      # 从 Secret 解码 keystore 到临时文件，并通过环境变量注入 Gradle；
      # 未配置 Secrets 时 Gradle 自动回退到默认 debug key，本地/早期环境仍可正常构建。
      - name: Decode release keystore
        # 注意：secrets 上下文不能在 if: 条件中使用，故把密钥放入 env，在脚本里判断是否为空
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release-key.jks"
            {
              echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release-key.jks"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PW"
              echo "RELEASE_STORE_PASSWORD=$STORE_PW"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MC/DC Generator ${{ steps.ver.outputs.tag }}
          # tag 含 '-'（如 v0.1.0-beta）自动标记为预发布，且不抢占 Latest；纯 v* 为正式版
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          body: |
            🚀 发行版本 ${{ steps.ver.outputs.tag }}
            类型: ${{ contains(github.ref_name, '-') && '🧪 测试版 (pre-release)' || '✅ 正式版' }}
            - 提交: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
